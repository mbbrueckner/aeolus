[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aeolus"
version = "1.0.0"
description = "Weather along a cycling route, at the times you will actually be there."
requires-python = ">=3.10"
authors = [{ name = "mbbrueckner" }]
dependencies = [
    "gpxpy",
    "numpy",
    "openmeteo-requests",
    "openmeteo-sdk",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
# Only needed to serve the app yourself. Vercel runs the ASGI app directly.
server = [
    "uvicorn>=0.52.1",
]
notebook = [
    "jupyter",
    "ipywidgets>=8.0",
    "folium",
    "voila",
]
analysis = [
    "garmin-fit-sdk>=21.212.0",
]

[dependency-groups]
dev = [
    "pytest",
    "garmin-fit-sdk>=21.212.0",
    "httpx>=0.28.1",
]

# The app is not at one of the filenames Vercel probes for by default.
[tool.vercel]
entrypoint = "app.web.api:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
