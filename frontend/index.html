<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fdfcf9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wetter entlang deiner Radroute — zu den Zeiten, zu denen du dort bist." />
    <title>Aeolus — Wetter entlang deiner Route</title>
    <script>
      // Apply the theme before first paint, otherwise the light theme flashes
      // for a moment on a dark system.
      (function () {
        try {
          var saved = localStorage.getItem('aeolus:theme')
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'aeolus-dark' : 'aeolus-light',
          )
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#231e19' : '#fdfcf9')
        } catch (error) {
          /* Private mode blocks localStorage; the default theme is fine. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
